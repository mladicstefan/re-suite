[package]
name = "ledger-cli"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "ledger-cli"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
ledger-checkers = { version = "0.1.0", path = "../ledger-checkers" }
ledger-core = { version = "0.1.0", path = "../ledger-core" }
ledger-os = { version = "0.1.0", path = "../ledger-os" }
ledger-store = { version = "0.1.0", path = "../ledger-store" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
