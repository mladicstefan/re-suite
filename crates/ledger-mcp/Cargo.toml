[package]
name = "ledger-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.105"
ledger-checkers = { version = "0.1.0", path = "../ledger-checkers" }
ledger-core = { version = "0.1.0", path = "../ledger-core" }
ledger-store = { version = "0.1.0", path = "../ledger-store" }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "process", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
