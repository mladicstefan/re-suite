[package]
name = "ledger-checkers"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.13.0"
jsonschema = { version = "0.63.1", default-features = false }
ledger-core = { version = "0.1.0", path = "../ledger-core" }
md-5 = "0.11.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.2"
thiserror = "2.0.21"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

# md-5's library is named `md5`, which machete does not map back to the package.
[package.metadata.cargo-machete]
ignored = ["md-5"]
